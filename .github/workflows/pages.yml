name: Deploy site (Cloudflare Pages)

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/sync-from-catalog.py"
      - "README.md"
      - "AGENTS.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

concurrency:
  group: pages-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    name: Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Catalog sync check
        run: python3 scripts/sync-from-catalog.py --check
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=f00 --branch=main
